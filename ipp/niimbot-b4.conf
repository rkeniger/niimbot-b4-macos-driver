# NIIMBOT B4 printer attributes for ippeveprinter(1), loaded with "-a".
# ipptool(1) file syntax. Sizes are the label presets from ppd/niimbot-b4.drv
# plus a custom range (20-108 mm wide, 20-350 mm long, the vendor limits).
# Dimensions are in hundredths of a millimetre.

ATTR text printer-make-and-model "NIIMBOT B4"
ATTR text printer-device-id "MFG:NIIMBOT;MDL:B4;CMD:PWGRaster,AppleRaster;CLS:PRINTER;"
ATTR keyword printer-kind label
ATTR boolean color-supported false
ATTR integer pages-per-minute 6
ATTR keyword sides-default one-sided
ATTR keyword sides-supported one-sided

# Copies are done by the printer (SetPageSize count), so the client sends one
# copy of each page and the "copies" job attribute.
ATTR integer copies-default 1
ATTR rangeOfInteger copies-supported 1-99

ATTR enum finishings-default 3
ATTR enum finishings-supported 3
ATTR enum orientation-requested-default 3
ATTR enum orientation-requested-supported 3,4,5,6
ATTR keyword output-bin-default face-up
ATTR keyword output-bin-supported face-up
ATTR boolean page-ranges-supported false

ATTR keyword print-color-mode-default monochrome
ATTR keyword print-color-mode-supported auto,monochrome
ATTR keyword print-content-optimize-default auto
ATTR keyword print-content-optimize-supported auto
# print-quality selects the print density: draft = 2, normal = NIIMBOT_DENSITY
# (default 3), high = 5.
ATTR enum print-quality-default 4
ATTR enum print-quality-supported 3,4,5
ATTR keyword print-rendering-intent-default auto
ATTR keyword print-rendering-intent-supported auto

ATTR resolution printer-resolution-default 203dpi
ATTR resolution printer-resolution-supported 203dpi
ATTR resolution pwg-raster-document-resolution-supported 203dpi
ATTR keyword pwg-raster-document-sheet-back normal
ATTR keyword pwg-raster-document-type-supported black_1,sgray_8
ATTR keyword urf-supported CP99,IS1,PQ3-4-5,RS203,V1.4,W8

# Media. media-type selects the label sensor mode: labels = gap (die-cut),
# labels-black-mark = black mark, transparency = transparent labels.
ATTR keyword media-source-supported main
ATTR keyword media-type-supported labels,labels-black-mark,transparency
ATTR integer media-bottom-margin-supported 0
ATTR integer media-left-margin-supported 0
ATTR integer media-right-margin-supported 0
ATTR integer media-top-margin-supported 0

ATTR keyword media-supported om_100x150mm_100x150mm,om_100x100mm_100x100mm,om_100x180mm_100x180mm,om_100x50mm_100x50mm,om_100x30mm_100x30mm,om_75x100mm_75x100mm,om_70x40mm_70x40mm,om_60x40mm_60x40mm,om_50x80mm_50x80mm,om_50x30mm_50x30mm,om_40x30mm_40x30mm,om_30x20mm_30x20mm
ATTR keyword media-default om_100x150mm_100x150mm
ATTR keyword media-ready om_100x150mm_100x150mm

ATTR collection media-size-supported { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 15000 },
    { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 10000 },
    { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 18000 },
    { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 5000 },
    { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 3000 },
    { MEMBER integer x-dimension 7500 MEMBER integer y-dimension 10000 },
    { MEMBER integer x-dimension 7000 MEMBER integer y-dimension 4000 },
    { MEMBER integer x-dimension 6000 MEMBER integer y-dimension 4000 },
    { MEMBER integer x-dimension 5000 MEMBER integer y-dimension 8000 },
    { MEMBER integer x-dimension 5000 MEMBER integer y-dimension 3000 },
    { MEMBER integer x-dimension 4000 MEMBER integer y-dimension 3000 },
    { MEMBER integer x-dimension 3000 MEMBER integer y-dimension 2000 },
    { MEMBER rangeOfInteger x-dimension 2000-10800 MEMBER rangeOfInteger y-dimension 2000-35000 }

ATTR collection media-col-database { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 15000 } MEMBER keyword media-size-name om_100x150mm_100x150mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels },
    { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 10000 } MEMBER keyword media-size-name om_100x100mm_100x100mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels },
    { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 18000 } MEMBER keyword media-size-name om_100x180mm_100x180mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels },
    { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 5000 } MEMBER keyword media-size-name om_100x50mm_100x50mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels },
    { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 3000 } MEMBER keyword media-size-name om_100x30mm_100x30mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels },
    { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 7500 MEMBER integer y-dimension 10000 } MEMBER keyword media-size-name om_75x100mm_75x100mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels },
    { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 7000 MEMBER integer y-dimension 4000 } MEMBER keyword media-size-name om_70x40mm_70x40mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels },
    { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 6000 MEMBER integer y-dimension 4000 } MEMBER keyword media-size-name om_60x40mm_60x40mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels },
    { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 5000 MEMBER integer y-dimension 8000 } MEMBER keyword media-size-name om_50x80mm_50x80mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels },
    { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 5000 MEMBER integer y-dimension 3000 } MEMBER keyword media-size-name om_50x30mm_50x30mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels },
    { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 4000 MEMBER integer y-dimension 3000 } MEMBER keyword media-size-name om_40x30mm_40x30mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels },
    { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 3000 MEMBER integer y-dimension 2000 } MEMBER keyword media-size-name om_30x20mm_30x20mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels }

ATTR collection media-col-default { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 15000 } MEMBER keyword media-size-name om_100x150mm_100x150mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels }
ATTR collection media-col-ready { MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER collection media-size { MEMBER integer x-dimension 10000 MEMBER integer y-dimension 15000 } MEMBER keyword media-size-name om_100x150mm_100x150mm MEMBER keyword media-source main MEMBER integer media-top-margin 0 MEMBER keyword media-type labels }
